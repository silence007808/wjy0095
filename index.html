<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>文均煜 · 个人简历</title>
    <style>
        /* ===== CSS Variables & Reset ===== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        :root {
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            --bg: #f0f4f8;
            --bg-card: #ffffff;
            --bg-nav: rgba(255, 255, 255, 0.75);
            --text: #0b1a2e;
            --text-secondary: #3d4f66;
            --text-light: #7a8a9e;
            --border: #dce3ec;
            --shadow: 0 8px 30px rgba(0, 20, 40, 0.08);
            --shadow-hover: 0 16px 48px rgba(0, 20, 40, 0.16);
            --primary: #1e4b7a;
            --primary-light: #2d6da8;
            --primary-lighter: #e6eef9;
            --accent: #d4a13e;
            --accent-light: #f5e6c8;
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.22s ease;
            --nav-height: 66px;
            --max-width: 1120px;
        }
        [data-theme="dark"] {
            --bg: #0b1422;
            --bg-card: #162033;
            --bg-nav: rgba(11, 20, 34, 0.82);
            --text: #e6edf5;
            --text-secondary: #b0c0d4;
            --text-light: #7a8ea6;
            --border: #2a3a52;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 16px 48px rgba(0, 0, 0, 0.6);
            --primary: #4a8bcb;
            --primary-light: #6aa8e0;
            --primary-lighter: #1a2c44;
            --accent: #e8b84a;
            --accent-light: #3a2e1a;
        }
        html {
            scroll-behavior: smooth;
        }
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: var(--nav-height);
            -webkit-font-smoothing: antialiased;
        }
        a {
            color: var(--primary);
            text-decoration: none;
            transition: color var(--transition);
        }
        a:hover {
            color: var(--primary-light);
        }
        img,
        svg {
            display: block;
            max-width: 100%;
        }
        /* ===== Scrollbar ===== */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary-light);
            border-radius: 8px;
        }

        /* ===== Utilities ===== */
        .container {
            max-width: var(--max-width);
            margin: 0 auto;
            padding: 0 24px;
        }
        .section {
            padding: 56px 0 40px;
            border-bottom: 1px solid var(--border);
        }
        .section:last-of-type {
            border-bottom: none;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.01em;
            margin-bottom: 28px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title::after {
            content: '';
            flex: 1;
            height: 2px;
            background: linear-gradient(90deg, var(--primary), transparent);
            opacity: 0.3;
        }
        .badge {
            display: inline-block;
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: 500;
            background: var(--primary-lighter);
            color: var(--primary);
            transition: background var(--transition), color var(--transition);
        }
        .badge-accent {
            background: var(--accent-light);
            color: var(--accent);
        }
        .tag {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 500;
            background: var(--border);
            color: var(--text-secondary);
            transition: background var(--transition), color var(--transition);
            letter-spacing: 0.02em;
        }

        /* ===== Navigation ===== */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--nav-height);
            z-index: 1000;
            background: var(--bg-nav);
            backdrop-filter: blur(16px) saturate(1.4);
            -webkit-backdrop-filter: blur(16px) saturate(1.4);
            border-bottom: 1px solid var(--border);
            transition: background var(--transition), border-color var(--transition);
            display: flex;
            align-items: center;
        }
        .navbar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }
        .navbar-brand {
            font-weight: 700;
            font-size: 1.15rem;
            letter-spacing: -0.01em;
            color: var(--text);
            transition: color var(--transition);
            white-space: nowrap;
        }
        .navbar-brand span {
            color: var(--primary);
        }
        .navbar-links {
            display: flex;
            align-items: center;
            gap: 6px;
            list-style: none;
            flex-wrap: wrap;
        }
        .navbar-links a {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all var(--transition);
            position: relative;
        }
        .navbar-links a:hover,
        .navbar-links a:focus {
            color: var(--text);
            background: var(--border);
        }
        .navbar-links a.active {
            color: var(--primary);
            background: var(--primary-lighter);
        }
        .navbar-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .navbar-actions button {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--text-secondary);
            transition: all var(--transition);
            background: var(--bg-card);
            border: 1px solid var(--border);
        }
        .navbar-actions button:hover {
            background: var(--border);
            color: var(--text);
            transform: scale(1.04);
        }
        .navbar-actions button:active {
            transform: scale(0.94);
        }
        .navbar-toggle {
            display: none;
            background: transparent;
            border: none;
            font-size: 1.3rem;
            color: var(--text);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
        }
        @media (max-width: 760px) {
            .navbar-links {
                display: none;
                position: absolute;
                top: var(--nav-height);
                left: 0;
                right: 0;
                background: var(--bg-nav);
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
                flex-direction: column;
                padding: 16px 24px;
                gap: 4px;
                border-bottom: 1px solid var(--border);
                box-shadow: var(--shadow);
            }
            .navbar-links.open {
                display: flex;
            }
            .navbar-links a {
                padding: 10px 16px;
                width: 100%;
                border-radius: 8px;
            }
            .navbar-toggle {
                display: block;
            }
            .navbar-actions button {
                width: 34px;
                height: 34px;
                font-size: 0.95rem;
            }
        }

        /* ===== Hero ===== */
        .hero {
            padding: 40px 0 32px;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 32px;
            align-items: center;
        }
        .hero-main {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .hero-name {
            font-size: 2.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.1;
            color: var(--text);
        }
        .hero-name span {
            color: var(--primary);
        }
        .hero-title {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .hero-desc {
            font-size: 0.98rem;
            color: var(--text-secondary);
            max-width: 560px;
            line-height: 1.7;
        }
        .hero-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 4px;
        }
        .hero-tags .badge {
            font-size: 0.75rem;
            padding: 4px 16px;
        }
        .hero-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 6px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: all var(--transition);
            background: var(--bg-card);
            color: var(--text);
            border: 1px solid var(--border);
        }
        .btn-primary {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-light);
            border-color: var(--primary-light);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(30, 75, 122, 0.25);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
        }
        .btn-outline:hover {
            background: var(--border);
            transform: translateY(-2px);
        }
        .hero-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            overflow: hidden;
            flex-shrink: 0;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            box-shadow: 0 12px 40px rgba(30, 75, 122, 0.2);
        }
        .hero-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        @media (max-width: 600px) {
            .hero-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .hero-desc {
                max-width: 100%;
                margin: 0 auto;
            }
            .hero-tags {
                justify-content: center;
            }
            .hero-actions {
                justify-content: center;
            }
            .hero-avatar {
                width: 96px;
                height: 96px;
                margin: 0 auto;
            }
            .hero-name {
                font-size: 2.2rem;
            }
        }

        /* ===== Highlights ===== */
        .highlights-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }
        .highlight-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 20px;
            text-align: center;
            border: 1px solid var(--border);
            transition: all var(--transition);
            box-shadow: var(--shadow);
        }
        .highlight-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .highlight-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        .highlight-label {
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* ===== Tabs ===== */
        .tabs-container {
            margin-top: 8px;
        }
        .tabs-nav {
            display: flex;
            gap: 4px;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .tabs-nav button {
            background: transparent;
            border: none;
            padding: 10px 22px;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-sm) var(--radius-sm) 0 0;
            transition: all var(--transition);
            position: relative;
            font-family: var(--font);
        }
        .tabs-nav button::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 3px;
            background: var(--primary);
            border-radius: 4px 4px 0 0;
            transition: width var(--transition);
        }
        .tabs-nav button:hover {
            color: var(--text);
            background: var(--border);
        }
        .tabs-nav button[aria-selected="true"] {
            color: var(--primary);
        }
        .tabs-nav button[aria-selected="true"]::after {
            width: 70%;
        }
        .tabs-panel {
            display: none;
            animation: fadeIn 0.3s ease;
        }
        .tabs-panel.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* ===== Experience / Project Cards ===== */
        .exp-card,
        .project-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
            margin-bottom: 20px;
        }
        .exp-card:hover,
        .project-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }
        .exp-card:last-child,
        .project-card:last-child {
            margin-bottom: 0;
        }
        .exp-header,
        .project-header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px 16px;
            margin-bottom: 8px;
        }
        .exp-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: var(--text);
        }
        .exp-company {
            font-weight: 500;
            color: var(--primary);
        }
        .exp-period {
            font-size: 0.78rem;
            color: var(--text-light);
            font-weight: 500;
            white-space: nowrap;
        }
        .exp-desc {
            color: var(--text-secondary);
            font-size: 0.92rem;
            margin: 6px 0 10px;
            line-height: 1.6;
        }
        .exp-list {
            list-style: none;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .exp-list li {
            font-size: 0.88rem;
            color: var(--text-secondary);
            padding-left: 20px;
            position: relative;
            line-height: 1.6;
        }
        .exp-list li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--primary);
            font-weight: 700;
        }
        .project-tech {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 8px 0 10px;
        }
        .project-tech .tag {
            font-size: 0.7rem;
        }

        /* ===== Skills Matrix ===== */
        .skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px 32px;
        }
        .skill-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .skill-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            font-weight: 500;
        }
        .skill-info .name {
            color: var(--text);
        }
        .skill-info .level {
            color: var(--text-light);
        }
        .skill-bar {
            height: 6px;
            border-radius: 8px;
            background: var(--border);
            overflow: hidden;
            position: relative;
        }
        .skill-bar-fill {
            height: 100%;
            border-radius: 8px;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            transition: width 0.6s ease;
            width: 0;
        }
        .skill-bar-fill.animated {
            width: var(--fill);
        }
        @media (max-width: 560px) {
            .skills-grid {
                grid-template-columns: 1fr;
                gap: 12px;
            }
        }

        /* ===== Education ===== */
        .edu-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 24px 28px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .edu-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px 24px;
            align-items: baseline;
        }
        .edu-school {
            font-weight: 700;
            font-size: 1.1rem;
        }
        .edu-major {
            font-weight: 500;
            color: var(--primary);
        }
        .edu-period {
            font-size: 0.82rem;
            color: var(--text-light);
        }
        .edu-details {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px 24px;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }
        .edu-details span {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .edu-details .tag {
            font-size: 0.7rem;
        }

        /* ===== Certificates Gallery ===== */
        .cert-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
        }
        .cert-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            transition: all var(--transition);
        }
        .cert-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-hover);
        }
        .cert-card img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
            aspect-ratio: 4 / 3;
            background: var(--border);
        }
        .cert-card .cert-label {
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-align: center;
            border-top: 1px solid var(--border);
        }

        /* ===== Footer ===== */
        .footer {
            padding: 32px 0 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .footer a {
            color: var(--primary);
        }

        /* ===== Contact Modal ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 32px 40px;
            max-width: 420px;
            width: 100%;
            box-shadow: var(--shadow-hover);
            border: 1px solid var(--border);
            animation: fadeIn 0.25s ease;
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: transparent;
            border: none;
            font-size: 1.4rem;
            cursor: pointer;
            color: var(--text-light);
            transition: color var(--transition);
        }
        .modal-close:hover {
            color: var(--text);
        }
        .modal-box h3 {
            font-size: 1.1rem;
            margin-bottom: 16px;
        }
        .modal-contact-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 0.92rem;
        }
        .modal-contact-item:last-child {
            border-bottom: none;
        }
        .modal-contact-item .label {
            font-weight: 500;
            color: var(--text-secondary);
            min-width: 48px;
        }
        .modal-contact-item .value {
            color: var(--text);
            word-break: break-all;
        }
        .modal-contact-item .copy-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--primary);
            font-size: 0.8rem;
            padding: 2px 10px;
            border-radius: 6px;
            transition: all var(--transition);
            margin-left: auto;
            font-weight: 500;
        }
        .modal-contact-item .copy-btn:hover {
            background: var(--primary-lighter);
        }
        .modal-contact-item .copy-btn.copied {
            color: #2b8c5e;
        }

        /* ===== Back to top ===== */
        .back-top {
            position: fixed;
            bottom: 28px;
            right: 28px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: var(--primary);
            color: #fff;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(30, 75, 122, 0.3);
            transition: all var(--transition);
            opacity: 0;
            transform: translateY(20px);
            pointer-events: none;
            z-index: 500;
        }
        .back-top.visible {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }
        .back-top:hover {
            transform: translateY(-4px) scale(1.04);
            box-shadow: 0 12px 32px rgba(30, 75, 122, 0.4);
        }

        /* ===== Print ===== */
        @media print {
            body {
                background: #fff !important;
                color: #000 !important;
                padding-top: 0 !important;
            }
            .navbar,
            .back-top,
            .navbar-actions,
            .navbar-toggle,
            .btn-outline,
            .modal-overlay {
                display: none !important;
            }
            .container {
                max-width: 100% !important;
                padding: 0 16px !important;
            }
            .section {
                padding: 24px 0 16px !important;
                border-bottom-color: #ccc !important;
                page-break-inside: avoid;
            }
            .hero-avatar {
                background: #1e4b7a !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .hero-avatar img {
                filter: none !important;
            }
            .highlight-card,
            .exp-card,
            .project-card,
            .edu-card,
            .cert-card {
                background: #f8fafc !important;
                border-color: #d0d7e0 !important;
                box-shadow: none !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .skill-bar-fill {
                background: #1e4b7a !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .badge,
            .tag {
                background: #e8ecf1 !important;
                color: #1a2a3a !important;
                -webkit-print-color-adjust: exact !important;

        // ============================================================
        //  RENDER ENGINE

        function $(sel, ctx) { return (ctx || document).querySelector(sel); }
        function $$(sel, ctx) { return Array.from((ctx || document).querySelectorAll(sel)); }
        function escapeHtml(str) { const d = document.createElement('div');
            d.textContent = str; return d.innerHTML; }

        function buildContactList() {
            const c = resume.contact;
            const items = [
                { label: '📞 电话', value: c.phone },
                { label: '✉️ 邮箱', value: c.email },
                { label: '💬 微信', value: c.wechat },
                { label: '📍 地址', value: c.address }
            ];
            const container = document.getElementById('contactList');
            container.innerHTML = '';
            items.forEach(item => {
                const div = document.createElement('div');
                div.className = 'modal-contact-item';
                const labelSpan = document.createElement('span');
                labelSpan.className = 'label';
                labelSpan.textContent = item.label;
                const valueSpan = document.createElement('span');
                valueSpan.className = 'value';
                valueSpan.textContent = item.value;
                const copyBtn = document.createElement('button');
                copyBtn.className = 'copy-btn';
                copyBtn.textContent = '复制';
                copyBtn.setAttribute('data-copy', item.value);
                copyBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const val = this.getAttribute('data-copy');
                    navigator.clipboard.writeText(val).then(() => {
                        this.textContent = '✓ 已复制';
                        this.classList.add('copied');
                        setTimeout(() => { this.textContent = '复制';
                            this.classList.remove('copied'); }, 2000);
                    }).catch(() => {
                        const ta = document.createElement('textarea');
                        ta.value = val;
                        document.body.appendChild(ta);
                        ta.select();
                        document.execCommand('copy');
                        ta.remove();
                        this.textContent = '✓ 已复制';
                        this.classList.add('copied');
                        setTimeout(() => { this.textContent = '复制';
                            this.classList.remove('copied'); }, 2000);
                    });
                });
                div.appendChild(labelSpan);
                div.appendChild(valueSpan);
                div.appendChild(copyBtn);
                container.appendChild(div);
            });
        }

        function renderHero() {
            document.getElementById('heroDesc').textContent = resume.selfEvaluation;
            const tags = ['#视频剪辑', '#自媒体运营', '#内容策划', '#数据分析', '#自驱力'];
            const container = document.getElementById('heroTags');
            container.innerHTML = tags.map(t => `<span class="badge">${escapeHtml(t)}</span>`).join('');
        }

        function renderHighlights() {
            const grid = document.getElementById('highlightsGrid');
            grid.innerHTML = resume.highlights.map(h =>
                `<div class="highlight-card">
                    <div class="highlight-number">${escapeHtml(h.number)}</div>
                    <div class="highlight-label">${escapeHtml(h.label)}</div>
                </div>`
            ).join('');
        }

        function renderExperience() {
            const tabData = [
                { key: 'work', label: '💼 工作经历', data: resume.experience.work },
                { key: 'internship', label: '📎 实习经历', data: resume.experience.internship },
                { key: 'campus', label: '🎯 校园经历', data: resume.experience.campus }
            ];
            const nav = document.querySelector('#expTabs .tabs-nav');
            const panels = document.getElementById('expPanels');
            nav.innerHTML = '';
            panels.innerHTML = '';
            let firstActive = true;
            tabData.forEach((tab, idx) => {
                const btn = document.createElement('button');
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-selected', firstActive ? 'true' : 'false');
                btn.setAttribute('aria-controls', `exp-panel-${tab.key}`);
                btn.setAttribute('id', `exp-tab-${tab.key}`);
                btn.textContent = tab.label;
                btn.addEventListener('click', () => switchExpTab(tab.key));
                btn.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                        e.preventDefault();
                        const tabs = $$('#expTabs .tabs-nav button');
                        const idx2 = tabs.indexOf(e.target);
                        const next = e.key === 'ArrowRight' ? (idx2 + 1) % tabs.length : (idx2 - 1 + tabs.length) % tabs
                            .length;
                        tabs[next].click();
                        tabs[next].focus();
                    }
                });
                nav.appendChild(btn);
                const panel = document.createElement('div');
                panel.setAttribute('role', 'tabpanel');
                panel.setAttribute('aria-labelledby', `exp-tab-${tab.key}`);
                panel.id = `exp-panel-${tab.key}`;
                panel.className = `tabs-panel ${firstActive ? 'active' : ''}`;
                panel.dataset.key = tab.key;
                if (tab.data && tab.data.length > 0) {
                    panel.innerHTML = tab.data.map(exp =>
                        `<div class="exp-card">
                            <div class="exp-header">
                                <span class="exp-title">${escapeHtml(exp.title)}</span>
                                <span class="exp-period">${escapeHtml(exp.period)}</span>
                            </div>
                            <div class="exp-header" style="margin-top:-4px;">
                                <span class="exp-company">${escapeHtml(exp.company)}</span>
                            </div>
                            ${exp.desc ? `<div class="exp-desc">${escapeHtml(exp.desc)}</div>` : ''}
                            <ul class="exp-list">
                                ${exp.highlights.map(h => `<li>${escapeHtml(h)}</li>`).join('')}
                            </ul>
                        </div>`
                    ).join('');
                } else {
                    panel.innerHTML = `<div class="empty-state">✨ 暂无相关经历，期待未来在实践中成长</div>`;
                }
                panels.appendChild(panel);
                if (firstActive) firstActive = false;
            });
        }

        function switchExpTab(key) {
            const btns = $$('#expTabs .tabs-nav button');
            const panels = $$('#expTabs .tabs-panels');
            btns.forEach(b => b.setAttribute('aria-selected', 'false'));
            panels.forEach(p => p.classList.remove('active'));
            const targetBtn = document.getElementById(`exp-tab-${key}`);
            const targetPanel = document.getElementById(`exp-panel-${key}`);
            if (targetBtn) targetBtn.setAttribute('aria-selected', 'true');
            if (targetPanel) targetPanel.classList.add('active');
        }

        function renderProjects() {
            const nav = document.querySelector('#projectTabs .tabs-nav');
            const panels = document.getElementById('projectPanels');
            nav.innerHTML = '';
            panels.innerHTML = '';
            if (!resume.projects || resume.projects.length === 0) {
                panels.innerHTML = `<div class="empty-state">暂无项目</div>`;
                return;
            }
            resume.projects.forEach((proj, idx) => {
                const label = proj.name.length > 20 ? proj.name.slice(0, 18) + '…' : proj.name;
                const btn = document.createElement('button');
                btn.setAttribute('role', 'tab');
                btn.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');
                btn.setAttribute('aria-controls', `proj-panel-${idx}`);
                btn.setAttribute('id', `proj-tab-${idx}`);
                btn.textContent = label;
                btn.addEventListener('click', () => switchProjTab(idx));
                btn.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
                        e.preventDefault();
                        const tabs = $$('#projectTabs .tabs-nav button');
                        const i = tabs.indexOf(e.target);
                        const next = e.key === 'ArrowRight' ? (i + 1) % tabs.length : (i - 1 + tabs.length) % tabs
                            .length;
                        tabs[next].click();
                        tabs[next].focus();
                    }
                });
                nav.appendChild(btn);
                const panel = document.createElement('div');
                panel.setAttribute('role', 'tabpanel');
                panel.setAttribute('aria-labelledby', `proj-tab-${idx}`);
                panel.id = `proj-panel-${idx}`;
                panel.className = `tabs-panel ${idx === 0 ? 'active' : ''}`;
                panel.dataset.idx = idx;
                const techHtml = proj.tech && proj.tech.length > 0 ?
                    `<div class="project-tech">${proj.tech.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` :
                    '';

                    `<ul class="exp-list">${proj.highlights.map(h => `<li>${escapeHtml(h)}</li>`).join('')}</ul>` :
                    '';
                panel.innerHTML = `
                    <div class="project-card">
                        <div class="exp-header">
                            <span class="exp-title">${escapeHtml(proj.name)}</span>
                            <span class="exp-period">${escapeHtml(proj.period)}</span>
                        </div>
                        <div class="exp-header" style="margin-top:-4px;">
                            <span class="exp-company">${escapeHtml(proj.role)}</span>
                        </div>
                        ${proj.desc ? `<div class="exp-desc">${escapeHtml(proj.desc)}</div>` : ''}
                        ${techHtml}
                        ${highlightsHtml}
                    </div>
                `;
                panels.appendChild(panel);
            });
        }

        function switchProjTab(idx) {
            const btns = $$('#projectTabs .tabs-nav button');
            const panels = $$('#projectTabs .tabs-panels');
            btns.forEach(b => b.setAttribute('aria-selected', 'false'));
            panels.forEach(p => p.classList.remove('active'));
            const targetBtn = document.getElementById(`proj-tab-${idx}`);
            const targetPanel = document.getElementById(`proj-panel-${idx}`);
            if (targetBtn) targetBtn.setAttribute('aria-selected', 'true');
            if (targetPanel) targetPanel.classList.add('active');
        }

        function renderSkills() {
            const grid = document.getElementById('skillsGrid');
            grid.innerHTML = resume.skills.map(s => {
                const fill = Math.min(Math.max(s.level, 0), 100);
                return `
                    <div class="skill-item">
                        <div class="skill-info">
                            <span class="name">${escapeHtml(s.name)}</span>
                            <span class="level">${fill}%</span>
                        </div>
                        <div class="skill-bar">
                            <div class="skill-bar-fill" style="--fill:${fill}%;width:0;" data-level="${fill}"></div>
                        </div>
                        <div style="font-size:0.7rem;color:var(--text-light);margin-top:2px;">${escapeHtml(s.desc)}</div>
                    </div>
                `;
            }).join('');
            requestAnimationFrame(() => {
                const fills = $$('.skill-bar-fill');
                fills.forEach(f => {
                    const level = parseFloat(f.dataset.level) || 0;
                    setTimeout(() => { f.style.width = level + '%'; }, 120);
                });
            });
        }

        function renderEducation() {
            const e = resume.education;
            const card = document.getElementById('eduCard');
            card.innerHTML = `
                <div class="edu-row">
                    <span class="edu-school">${escapeHtml(e.school)}</span>
                    <span class="edu-major">${escapeHtml(e.major)}</span>
                    <span class="edu-period">${escapeHtml(e.period)}</span>
                </div>
                <div class="edu-details">
                    <span>📚 主修课程：${e.courses.map(c => `<span class="tag">${escapeHtml(c)}</span>`).join(' ')}</span>
                    <span>📊 GPA：${escapeHtml(e.gpa)}</span>
                    <span>🏅 荣誉：${escapeHtml(e.honors)}</span>
                    <span>🌐 英语：${escapeHtml(e.english)}</span>
                </div>
            `;
        }

        function renderCertificates() {
            const grid = document.getElementById('certGrid');
            const images = resume.certificates || [];
            if (!images.length) {
                grid.innerHTML = `<div class="empty-state">暂无证书图片</div>`;
                return;
            }
            grid.innerHTML = images.map(src =>
                `<div class="cert-card">
                    <img src="${escapeHtml(src)}" alt="获奖证书" loading="lazy" />
                    <div class="cert-label">🏅 获奖证书</div>
                </div>`
            ).join('');
        }

        function renderFooter() {
            document.getElementById('footerYear').textContent = new Date().getFullYear();
            document.getElementById('footerUpdate').textContent = new Date().toLocaleDateString('zh-CN', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
        }

        // ============================================================
        //  INTERACTIONS
        // ============================================================
        function initTheme() {
            const stored = localStorage.getItem('theme') || 'light';
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            const theme = stored === 'dark' ? 'dark' : (stored === 'light' ? 'light' : (prefersDark ? 'dark' : 'light'));
            document.documentElement.setAttribute('data-theme', theme);
            document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌓';
        }

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌓';
        }

        function openModal() {
            document.getElementById('contactModal').classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('contactModal').classList.remove('open');
            document.body.style.overflow = '';
        }

        function initBackTop() {
            const btn = document.getElementById('backTop');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) { btn.classList.add('visible'); } else { btn.classList.remove('visible'); }
            });
            btn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });
        }

        function initNavActive() {
            const sections = $$('section[id]');
            const links = $$('.navbar-links a');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.id;
                        links.forEach(link => {
                            link.classList.toggle('active', link.getAttribute('href') === '#' + id);
                        });
                    }
                });
            }, { threshold: 0.35, rootMargin: '0px 0px -60px 0px' });
            sections.forEach(s => observer.observe(s));
        }

        function initMobileNav() {
            const toggle = document.getElementById('navToggle');
            const links = document.getElementById('navLinks');
            toggle.addEventListener('click', () => {
                const open = links.classList.toggle('open');
                toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
                toggle.textContent = open ? '✕' : '☰';
            });
            links.querySelectorAll('a').forEach(a => {
                a.addEventListener('click', () => {
                    links.classList.remove('open');
                    toggle.setAttribute('aria-expanded', 'false');
                    toggle.textContent = '☰';
                });
            });
        }

        function printResume() { window.print(); }

        // ============================================================
        //  INIT
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            renderHero();
            renderHighlights();
            renderExperience();
            renderProjects();
            renderSkills();
            renderEducation();
            renderCertificates();
            renderFooter();
            buildContactList();

            initTheme();
            document.getElementById('themeToggle').addEventListener('click', toggleTheme);

            const modal = document.getElementById('contactModal');
            document.getElementById('contactBtn').addEventListener('click', openModal);
            document.getElementById('heroContactBtn').addEventListener('click', openModal);
            document.getElementById('modalClose').addEventListener('click', closeModal);
            modal.addEventListener('click', function(e) { if (e.target === this) closeModal(); });
            document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });

            document.getElementById('printBtn').addEventListener('click', printResume);
            document.getElementById('heroPrintBtn').addEventListener('click', printResume);

            initBackTop();
            initNavActive();
            initMobileNav();
        });

        document.addEventListener('themeChange', function() {
            const fills = $$('.skill-bar-fill');
            fills.forEach(f => {
                const level = parseFloat(f.dataset.level) || 0;
                f.style.width = '0';
                setTimeout(() => { f.style.width = level + '%'; }, 100);
            });
        });
        const themeObserver = new MutationObserver(() => {
            document.dispatchEvent(new Event('themeChange'));
        });
        themeObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    </script>

</body>
</html>
